[project]
name = "ringvax"
version = "0.2.0"
description = ""
authors = [
    { name = "Scott Olesen", email = "ulp7@cdc.gov" },
    { name = "Andy Magee", email = "rzg0@cdc.gov" },
    { name = "Paige Miller", email = "yub1@cdc.gov" },
]
requires-python = "==3.12.4"
readme = "README.md"
dependencies = [
    "numpy>=2.2.0,<3",
    "streamlit>=1.41.0,<2",
    "polars>=1.17.1,<2",
    "matplotlib>=3.10.0,<4",
]

[dependency-groups]
dev = ["pytest>=8.3.4,<9"]
docs = [
    "zensical>=0.0.31",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
